name: Pages

# Builds the project website (website/) from docs/ and deploys it to GitHub Pages.
# The build reads docs/ and the README (image alt texts). Every pull request builds the site,
# because the job `build` is a required status check and a path filter would leave it missing.
# The build takes less than one minute. It fails on a broken internal link
# (starlight-links-validator). A push to main that changes the site also deploys it.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install the website dependencies
        working-directory: website
        run: npm ci
      - name: Build the website (fails on broken internal links)
        working-directory: website
        run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
