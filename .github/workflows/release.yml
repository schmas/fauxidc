name: Release

on:
  push:
    branches: [main]

# Jobs grant themselves only what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    # release-plz writes with the App token below; GITHUB_TOKEN only reads for checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          # Must match rust-toolchain.toml.
          toolchain: 1.100.0
      # GitHub starts no workflows for events caused by GITHUB_TOKEN. A GitHub App token
      # opens the release PR, so CI and Conformance run on it. The App has Contents and
      # Pull requests read/write and is installed on this repo only.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          # The registry-mode behavior was checked against this version (see release-plz.toml).
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    # crates.io trusted publishing: the `release` environment and `id-token: write` let
    # crates-io-auth-action exchange the GitHub OIDC token for a short-lived crates.io token.
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      # The releases output is a JSON array of {package_name, version, tag, ...}.
      tag: ${{ fromJSON(steps.release-plz.outputs.releases || '[]')[0].tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          # Must match rust-toolchain.toml.
          toolchain: 1.100.0
      - id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          # The registry-mode behavior was checked against this version (see release-plz.toml).
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  binaries:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-latest
            zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-latest
            zigbuild: false
    env:
      TAG: ${{ needs.release.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          # Must match rust-toolchain.toml.
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.zigbuild
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: matrix.zigbuild
        with:
          tool: cargo-zigbuild
      - name: Build with zigbuild
        if: matrix.zigbuild
        run: cargo zigbuild --release --target "$TARGET"
      - name: Build
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --target "$TARGET"
      - name: Package
        run: |
          name="fauxidc-${TAG}-${TARGET}"
          mkdir "$name"
          mkdir "$name/examples"
          cp "target/${TARGET}/release/fauxidc" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          cp examples/*.toml examples/docker-compose.yml "$name/examples/"
          tar -czf "${name}.tar.gz" "$name"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="fauxidc-${TAG}-${TARGET}"
          gh release upload "$TAG" "${name}.tar.gz" "${name}.tar.gz.sha256" --clobber
      - name: Keep the Linux binary for the image
        if: matrix.zigbuild
        uses: actions/upload-artifact@v7
        with:
          name: fauxidc-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/fauxidc
          if-no-files-found: error

  image:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: fauxidc-x86_64-unknown-linux-musl
          path: dist/amd64
      - uses: actions/download-artifact@v8
        with:
          name: fauxidc-aarch64-unknown-linux-musl
          path: dist/arm64
      - name: Set binary mode
        run: chmod 755 dist/amd64/fauxidc dist/arm64/fauxidc
      - name: Compute image tags
        id: tags
        # A pre-release version (with a "-", such as 0.2.0-rc.1) gets only its version tag;
        # :latest stays on the newest stable release.
        run: |
          version="${TAG#v}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/schmas/fauxidc:${version}"
            case "$version" in
              *-*) ;;
              *) echo "ghcr.io/schmas/fauxidc:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
