# Weekly dependency updates. Minor and patch updates make one PR per ecosystem.
# A major update makes its own PR.
# release-plz reads the commit prefix: `build(deps)` for the crate dependencies (shipped in
# the binary) and `chore(deps)` for the tooling (website, workflows, image).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      website-minor-patch:
        update-types: [minor, patch]

  # The SPA libraries that spa-e2e tests fauxidc against. Keep them current, so CI finds
  # a library change that breaks fauxidc before a user does.
  - package-ecosystem: npm
    directory: /e2e/spa
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      e2e-spa-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
