<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>example-spa (oidc-client-ts)</title>
<script src="/lib/oidc-client-ts.js"></script>
</head>
<body>
<h2>example-spa with oidc-client-ts</h2>
<button id="login">Log in</button>
<button id="refresh">Refresh</button>
<button id="logout">Log out</button>
<p>Status: <span id="status">loading</span></p>
<p>Access token jti: <span id="token"></span></p>
<p id="error"></p>
<script>
  const statusEl = document.getElementById("status");
  const tokenEl = document.getElementById("token");
  const errorEl = document.getElementById("error");

  function jtiOf(jwt) {
    const payload = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(atob(payload)).jti;
  }

  function render(user) {
    if (user && !user.expired) {
      statusEl.textContent = "logged-in:" + user.profile.email;
      tokenEl.textContent = jtiOf(user.access_token);
    } else {
      statusEl.textContent = "logged-out";
      tokenEl.textContent = "";
    }
  }

  const mgr = new oidc.UserManager({
    authority: "http://localhost:9000/oauth2/default",
    client_id: "example-spa",
    redirect_uri: "http://localhost:5174/",
    post_logout_redirect_uri: "http://localhost:5174/",
    scope: "openid profile email offline_access",
    response_type: "code",
  });

  (async () => {
    const params = new URLSearchParams(location.search);
    if (params.has("code")) {
      await mgr.signinRedirectCallback();
      history.replaceState({}, "", "/");
    } else if (params.has("state")) {
      await mgr.signoutRedirectCallback();
      history.replaceState({}, "", "/");
    }
    document.getElementById("login").onclick = () => mgr.signinRedirect();
    document.getElementById("refresh").onclick = async () => {
      try {
        render(await mgr.signinSilent());
      } catch (e) {
        errorEl.textContent = String(e);
      }
    };
    document.getElementById("logout").onclick = () => mgr.signoutRedirect();
    render(await mgr.getUser());
  })().catch((e) => {
    statusEl.textContent = "logged-out";
    errorEl.textContent = String(e);
  });
</script>
</body>
</html>
