[package]
name = "fauxidc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Small OAuth 2.0 / OpenID Connect mock server for local development and tests."
license = "MIT OR Apache-2.0"
repository = "https://github.com/schmas/fauxidc"
readme = "README.md"
keywords = ["oidc", "oauth2", "mock", "testing", "identity"]
categories = ["development-tools::testing", "authentication"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Allowed pedantic lints:
module_name_repetitions = "allow"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
