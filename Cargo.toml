[package]
name = "fauxidc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Small OAuth 2.0 / OpenID Connect mock server for local development and tests."
license = "MIT OR Apache-2.0"
repository = "https://github.com/schmas/fauxidc"
readme = "README.md"
keywords = ["oidc", "oauth2", "mock", "testing", "identity"]
categories = ["development-tools::testing", "authentication"]
exclude = [
    "/.github",
    "/.dockerignore",
    "/Dockerfile",
    "/conformance",
    "/deny.toml",
    "/dist",
    "/docs/testing",
    "/e2e",
    "/release-plz.toml",
    "/scripts",
]

[dependencies]
anyhow = "1.0.104"
arc-swap = "1"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
minijinja = { version = "3.1.0", features = ["serde"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
rsa = "0.10.0"
rust-embed = "8.14.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[features]
# HTTPS from user-provided PEM files. Off by default: ring needs a C compiler.
tls = ["dep:rustls", "dep:tokio-rustls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Allowed pedantic lints:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
openidconnect = { version = "4.1.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
