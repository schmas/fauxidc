#:schema https://raw.githubusercontent.com/schmas/fauxidc/main/schema/fauxidc.schema.json
# Example Issuer in the style of a Keycloak realm.
# Run: fauxidc --config examples/keycloak.toml
# Discovery: http://localhost:9000/realms/example/.well-known/openid-configuration
#
# Imitated with config: the claim `typ = "Bearer"` in the access token (`access_claims`), the
# access token `aud` `account` (`audience`), `realm_access.roles` and `preferred_username`.
#
# Not imitated, because config cannot express it:
# - Keycloak access tokens have the header `typ` `JWT`. fauxidc always sends `at+jwt` (RFC 9068).
#   A validator that requires `JWT` must allow `at+jwt`.
# - Keycloak access tokens have the claim `azp` (the client id). `azp` is a protocol claim, so
#   config cannot set it. fauxidc adds `client_id` and `scope` instead, which Keycloak does not send.
# - Keycloak does not put `realm_access` in the id token. User claims go into both tokens here.

[issuer.keycloak]
issuer_url = "http://localhost:9000/realms/example"
paths = { authorize = "/protocol/openid-connect/auth", token = "/protocol/openid-connect/token", userinfo = "/protocol/openid-connect/userinfo", jwks = "/protocol/openid-connect/certs", endsession = "/protocol/openid-connect/logout", introspect = "/protocol/openid-connect/token/introspect", revoke = "/protocol/openid-connect/revoke" }

[client.keycloak_app]
issuer = "keycloak"
client_id = "example-app"
client_secret = "local"
redirect_uris = ["http://localhost:3000/callback"]
post_logout_redirect_uris = ["http://localhost:3000/"]
audience = "account"
access_claims = { typ = "Bearer" }

[user.alice]
label = "Alice Admin"
claims = { email = "alice@example.com", given_name = "Alice", family_name = "Admin", name = "Alice Admin", email_verified = true, preferred_username = "alice", realm_access = { roles = ["admin"] } }

[user.bob]
label = "Bobby Viewer"
claims = { email = "bob@example.com", given_name = "Bobby", family_name = "Viewer", name = "Bobby Viewer", email_verified = true, preferred_username = "bob", realm_access = { roles = ["viewer"] } }
