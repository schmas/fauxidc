# Example Issuer in the style of an Amazon Cognito user pool.
# Run: fauxidc --config examples/cognito.toml
# Discovery: http://localhost:9000/us-east-1_example/.well-known/openid-configuration
#
# Imitated with config: `cognito:username`, `cognito:groups`, `username` and `token_use` claims,
# and the sign-out parameter `logout_uri` (`logout_param_aliases`).
#
# Not imitated, because config cannot express it:
# - The real hosted UI runs on a separate domain from the Issuer. Here all endpoints are
#   below the Issuer path. An app must read the endpoints from discovery.
# - Cognito access tokens have `client_id` and no `aud`. fauxidc always sets `aud` (RFC 9068).
#   An app that checks `client_id` works.
# - Cognito serves its keys at `<issuer>/.well-known/jwks.json`. `validate` rejects a `paths.jwks`
#   under `/.well-known`, so the path here is `/jwks.json`. An app that reads `jwks_uri` from
#   discovery works. An app with the real path in its code does not.
# - Real Cognito access tokens have no `email` or `name`. User claims go into both tokens here.
# - Real Cognito tokens have `iss` `https://cognito-idp.<region>.amazonaws.com/<pool>`. An app
#   that checks the full host fails against `localhost`.

[issuer.cognito]
issuer_url = "http://localhost:9000/us-east-1_example"
paths = { authorize = "/oauth2/authorize", token = "/oauth2/token", userinfo = "/oauth2/userInfo", jwks = "/jwks.json", endsession = "/logout", revoke = "/oauth2/revoke" }
logout_param_aliases = { logout_uri = "post_logout_redirect_uri" }

[client.cognito_app]
issuer = "cognito"
client_id = "example-app"
client_secret = "local"
redirect_uris = ["http://localhost:3000/callback"]
post_logout_redirect_uris = ["http://localhost:3000/"]
id_claims = { token_use = "id" }
access_claims = { token_use = "access" }

[user.alice]
label = "Alice Admin"
claims = { email = "alice@example.com", email_verified = true, name = "Alice Admin", "cognito:username" = "alice", username = "alice", "cognito:groups" = ["admin"] }

[user.bob]
label = "Bobby Viewer"
claims = { email = "bob@example.com", email_verified = true, name = "Bobby Viewer", "cognito:username" = "bob", username = "bob", "cognito:groups" = ["viewer"] }
