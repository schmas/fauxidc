#:schema https://raw.githubusercontent.com/schmas/fauxidc/main/schema/fauxidc.schema.json
# Example Issuer in the style of a hosted tenant with a path prefix and no trailing slash.
# Run: fauxidc --config examples/okta.toml
# Discovery: http://localhost:9000/oauth2/default/.well-known/openid-configuration
#
# Some SDKs expect provider-specific endpoint paths such as /v1/keys.
# The `paths` key sets them. Discovery publishes the resulting URLs.

[issuer.okta]
issuer_url = "http://localhost:9000/oauth2/default"
sub_template = "00u{user_id}"
paths = { authorize = "/v1/authorize", token = "/v1/token", userinfo = "/v1/userinfo", jwks = "/v1/keys", endsession = "/v1/logout", introspect = "/v1/introspect", revoke = "/v1/revoke" }

[client.example_app]
issuer = "*"
client_id = "example-app"
client_secret = "local"
redirect_uris = ["http://localhost:3000/api/auth/callback/*"]
post_logout_redirect_uris = ["http://localhost:3000/"]

[client.example_spa]
issuer = "*"
client_id = "example-spa"
redirect_uris = ["http://localhost:5173/", "http://localhost:5174/"]
post_logout_redirect_uris = ["http://localhost:5173/", "http://localhost:5174/"]

[user.alice]
label = "Alice Admin"
claims = { email = "alice@example.com", given_name = "Alice", family_name = "Admin", name = "Alice Admin", email_verified = true, roles = ["admin"], preferred_username = "alice@example.com" }

[user.bob]
label = "Bobby Viewer"
claims = { email = "bob@example.com", given_name = "Bobby", family_name = "Viewer", name = "Bobby Viewer", email_verified = true, roles = ["viewer"], preferred_username = "bob@example.com" }
