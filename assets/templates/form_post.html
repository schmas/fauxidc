<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Continue · fauxidc</title>
<link rel="stylesheet" href="{{ static_base|href }}/halo.css">
</head>
<body>
<div class="page">
<header class="page-top">
<span class="brand"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></svg>fauxidc</span>
<span class="label label-warning">Mock server · not for production</span>
</header>
<main class="card">
<form method="post" action="{{ redirect_uri|href }}" class="stack">
<div class="card-head">
<h1>Continue to the application</h1>
<div class="row"><span class="label label-pair"><span>Issuer</span><span>{{ issuer_id }}</span></span></div>
</div>
{% for pair in fields %}<input type="hidden" name="{{ pair[0] }}" value="{{ pair[1] }}">
{% endfor %}<p class="muted">This page sends the response to the application. If nothing happens, click Continue.</p>
<div class="row"><button type="submit" class="btn">Continue</button></div>
</form>
</main>
<footer class="page-foot">A mock OpenID Provider for development and tests. Never enter real credentials.</footer>
</div>
<script>document.forms[0].submit();</script>
</body>
</html>
